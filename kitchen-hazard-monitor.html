<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="description" content="M5Stackで台所の温湿度と生ごみのコバエ発生リスクを見守るスマホ画面">
  <title>コバエみまもり</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f1e8;
      --surface: #fffdf8;
      --surface-strong: #ffffff;
      --ink: #24251f;
      --ink-soft: #6f7067;
      --line: #e3ded2;
      --brand: #4f6a54;
      --brand-dark: #344b3a;
      --accent: #f2b649;
      --safe: #4e8b61;
      --caution: #d69a2d;
      --warning: #de773b;
      --danger: #c84e43;
      --risk: var(--caution);
      --risk-soft: #fff2cf;
      --risk-ink: #74500c;
      --shadow: 0 18px 48px rgba(57, 52, 40, 0.10);
      --radius-lg: 28px;
      --radius-md: 20px;
      --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    }

    body[data-risk="safe"] {
      --risk: var(--safe);
      --risk-soft: #e6f2e7;
      --risk-ink: #315c3e;
    }

    body[data-risk="caution"] {
      --risk: var(--caution);
      --risk-soft: #fff2cf;
      --risk-ink: #74500c;
    }

    body[data-risk="warning"] {
      --risk: var(--warning);
      --risk-soft: #ffeadc;
      --risk-ink: #7d3716;
    }

    body[data-risk="danger"] {
      --risk: var(--danger);
      --risk-soft: #fde5e0;
      --risk-ink: #7b2822;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--page);
    }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 3px solid rgba(79, 106, 84, 0.34);
      outline-offset: 3px;
    }

    .app-shell {
      width: min(100%, 560px);
      min-height: 100svh;
      margin: 0 auto;
      padding: env(safe-area-inset-top) 18px 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      position: relative;
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      border: 2px solid var(--brand-dark);
      border-radius: 13px;
      background: var(--accent);
      box-shadow: 3px 3px 0 var(--brand-dark);
      color: var(--brand-dark);
      font-size: 18px;
      font-weight: 900;
      transform: rotate(-2deg);
    }

    .brand-mark::after {
      position: absolute;
      right: -4px;
      top: -5px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef7157;
      content: "";
    }

    .brand-name {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 600;
    }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .connection.is-live .connection-dot {
      background: var(--safe);
      box-shadow: 0 0 0 1px var(--safe);
    }

    main {
      display: grid;
      gap: 14px;
      padding-bottom: 8px;
    }

    .risk-panel {
      position: relative;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--risk) 28%, var(--line));
      border-radius: var(--radius-lg);
      background: var(--risk-soft);
      box-shadow: var(--shadow);
    }

    .risk-panel::before,
    .risk-panel::after {
      position: absolute;
      border-radius: 50%;
      background: var(--risk);
      content: "";
      opacity: 0.12;
      pointer-events: none;
    }

    .risk-panel::before {
      right: -42px;
      top: -48px;
      width: 150px;
      height: 150px;
    }

    .risk-panel::after {
      right: 84px;
      top: 32px;
      width: 24px;
      height: 24px;
    }

    .risk-main {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 126px;
      gap: 10px;
      min-height: 236px;
      padding: 24px 20px 18px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--risk-ink);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .risk-value-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 12px;
    }

    .risk-label {
      font-size: clamp(38px, 11vw, 52px);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 0.96;
    }

    .risk-points {
      margin-bottom: 3px;
      color: var(--risk-ink);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .risk-points strong {
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }

    .risk-heading {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.45;
    }

    .risk-message {
      max-width: 27ch;
      margin: 0;
      color: var(--risk-ink);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.7;
    }

    .mascot-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 170px;
    }

    .mascot-shadow {
      position: absolute;
      bottom: 18px;
      width: 86px;
      height: 15px;
      border-radius: 50%;
      background: rgba(36, 37, 31, 0.12);
    }

    .mascot {
      position: relative;
      z-index: 1;
      width: 100px;
      height: 114px;
      border: 3px solid var(--brand-dark);
      border-radius: 46% 54% 44% 48%;
      background: var(--accent);
      box-shadow: 5px 6px 0 rgba(52, 75, 58, 0.18);
      transform: rotate(2deg);
      transform-origin: center bottom;
    }

    .mascot::before,
    .mascot::after {
      position: absolute;
      top: 31px;
      width: 20px;
      height: 9px;
      border-top: 3px solid var(--brand-dark);
      content: "";
    }

    .mascot::before {
      left: -17px;
      border-radius: 12px 0 0;
      transform: rotate(-27deg);
    }

    .mascot::after {
      right: -17px;
      border-radius: 0 12px 0 0;
      transform: rotate(27deg);
    }

    .antenna {
      position: absolute;
      left: 48px;
      top: -23px;
      width: 2px;
      height: 25px;
      background: var(--brand-dark);
      transform: rotate(7deg);
    }

    .antenna::after {
      position: absolute;
      left: -5px;
      top: -7px;
      width: 11px;
      height: 11px;
      border: 2px solid var(--brand-dark);
      border-radius: 50%;
      background: #ef7157;
      content: "";
    }

    .eye {
      position: absolute;
      top: 39px;
      width: 8px;
      height: 11px;
      border-radius: 50%;
      background: var(--brand-dark);
      transition: height 160ms ease, transform 160ms ease;
    }

    .eye-left {
      left: 29px;
    }

    .eye-right {
      right: 29px;
    }

    .cheek {
      position: absolute;
      top: 57px;
      width: 13px;
      height: 7px;
      border-radius: 50%;
      background: #ef7157;
      opacity: 0.58;
    }

    .cheek-left {
      left: 17px;
    }

    .cheek-right {
      right: 17px;
    }

    .mouth {
      position: absolute;
      left: 50%;
      top: 59px;
      width: 31px;
      height: 18px;
      border-bottom: 4px solid var(--brand-dark);
      border-radius: 0 0 24px 24px;
      transform: translateX(-50%);
    }

    .mascot[data-expression="caution"] .mouth {
      top: 66px;
      width: 22px;
      height: 3px;
      border-bottom: 3px solid var(--brand-dark);
      border-radius: 4px;
    }

    .mascot[data-expression="warning"] .eye,
    .mascot[data-expression="danger"] .eye {
      height: 8px;
      transform: rotate(8deg);
    }

    .mascot[data-expression="warning"] .mouth,
    .mascot[data-expression="danger"] .mouth {
      top: 67px;
      width: 27px;
      height: 14px;
      border-top: 4px solid var(--brand-dark);
      border-bottom: 0;
      border-radius: 22px 22px 0 0;
    }

    .sweat {
      position: absolute;
      right: 13px;
      top: 15px;
      width: 9px;
      height: 14px;
      border-radius: 9px 9px 9px 2px;
      background: #6db9cb;
      opacity: 0;
      transform: rotate(28deg);
    }

    .mascot[data-expression="danger"] .sweat {
      opacity: 1;
    }

    .foot {
      position: absolute;
      bottom: -10px;
      width: 24px;
      height: 13px;
      border: 3px solid var(--brand-dark);
      border-radius: 50%;
      background: #ef7157;
    }

    .foot-left {
      left: 13px;
      transform: rotate(-9deg);
    }

    .foot-right {
      right: 13px;
      transform: rotate(9deg);
    }

    .mascot-name {
      position: absolute;
      z-index: 2;
      right: 4px;
      bottom: -2px;
      padding: 5px 8px;
      border: 1px solid rgba(52, 75, 58, 0.22);
      border-radius: 10px;
      background: var(--surface);
      color: var(--brand-dark);
      font-size: 10px;
      font-weight: 800;
      transform: rotate(-3deg);
    }

    .confetti {
      position: absolute;
      z-index: 3;
      display: none;
      width: 8px;
      height: 15px;
      border-radius: 3px;
      background: #ef7157;
    }

    .confetti-one {
      left: 9px;
      top: 20px;
      transform: rotate(-22deg);
    }

    .confetti-two {
      right: 3px;
      top: 13px;
      background: var(--safe);
      transform: rotate(25deg);
    }

    .confetti-three {
      right: 19px;
      bottom: 25px;
      background: #6db9cb;
      transform: rotate(42deg);
    }

    .mascot-stage.is-celebrating .confetti {
      display: block;
    }

    .mascot-stage.is-celebrating .mascot {
      animation: celebrate 520ms ease-in-out 2;
    }

    .risk-scale {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 0 20px 20px;
      padding-top: 14px;
      border-top: 1px solid rgba(52, 75, 58, 0.16);
    }

    .risk-step {
      display: grid;
      gap: 6px;
      color: var(--risk-ink);
      font-size: 9px;
      font-weight: 800;
      text-align: center;
    }

    .risk-step::before {
      width: 100%;
      height: 6px;
      border-radius: 4px;
      background: rgba(36, 37, 31, 0.11);
      content: "";
    }

    .risk-step:nth-child(1)::before { background: var(--safe); }
    .risk-step:nth-child(2)::before { background: var(--caution); }
    .risk-step:nth-child(3)::before { background: var(--warning); }
    .risk-step:nth-child(4)::before { background: var(--danger); }

    .risk-step:not(.is-current) {
      opacity: 0.35;
    }

    .risk-step.is-current {
      transform: translateY(-2px);
    }

    .risk-step.is-current::before {
      height: 10px;
      box-shadow: 0 0 0 3px var(--surface);
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .metric-card,
    .last-disposal {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: 0 8px 26px rgba(57, 52, 40, 0.06);
    }

    .metric-card {
      padding: 18px;
    }

    .metric-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 800;
    }

    .metric-icon {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 10px;
      background: #fff0c8;
      color: #98640f;
      font-size: 14px;
      font-weight: 900;
    }

    .metric-card.humidity .metric-icon {
      background: #dff1f3;
      color: #34717c;
    }

    .metric-value {
      margin: 0;
      font-size: clamp(30px, 9vw, 38px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .metric-value small {
      margin-left: 3px;
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .metric-note {
      margin: 10px 0 0;
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.5;
    }

    .last-disposal {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 17px 18px;
    }

    .trash-icon {
      position: relative;
      display: grid;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 15px;
      background: #e6efe7;
      color: var(--brand-dark);
      font-size: 22px;
      line-height: 1;
    }

    .last-copy {
      min-width: 0;
      flex: 1;
    }

    .last-label {
      margin: 0 0 5px;
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 800;
    }

    .last-time {
      overflow: hidden;
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .elapsed-badge {
      flex: 0 0 auto;
      padding: 7px 9px;
      border-radius: 10px;
      background: var(--page);
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .action-dock {
      position: sticky;
      z-index: 10;
      bottom: 0;
      margin: 0 -18px;
      padding: 13px 18px calc(14px + env(safe-area-inset-bottom));
      background: var(--page);
      border-top: 1px solid rgba(227, 222, 210, 0.82);
    }

    .dispose-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 61px;
      gap: 10px;
      border: 0;
      border-radius: 19px;
      background: var(--brand-dark);
      box-shadow: 0 8px 0 #22352a, 0 17px 28px rgba(52, 75, 58, 0.20);
      color: #ffffff;
      cursor: pointer;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.02em;
      transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .dispose-button:active {
      box-shadow: 0 3px 0 #22352a, 0 9px 18px rgba(52, 75, 58, 0.16);
      transform: translateY(5px);
    }

    .dispose-button:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    .button-icon {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border-radius: 9px;
      background: #ffffff;
      color: var(--brand-dark);
      font-size: 16px;
      font-weight: 900;
    }

    .toast {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: calc(102px + env(safe-area-inset-bottom));
      width: max-content;
      max-width: calc(100vw - 36px);
      padding: 11px 15px;
      border-radius: 13px;
      background: var(--ink);
      box-shadow: 0 12px 30px rgba(36, 37, 31, 0.22);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .screen-reader-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes celebrate {
      0%, 100% { transform: translateY(0) rotate(2deg); }
      50% { transform: translateY(-15px) rotate(-4deg); }
    }

    @media (min-width: 620px) {
      body {
        padding: 28px 0;
      }

      .app-shell {
        min-height: calc(100svh - 56px);
        padding-right: 24px;
        padding-left: 24px;
        border: 1px solid var(--line);
        border-radius: 34px;
        background: var(--page);
        box-shadow: 0 24px 70px rgba(57, 52, 40, 0.12);
      }

      .action-dock {
        margin-right: -24px;
        margin-left: -24px;
        padding-right: 24px;
        padding-left: 24px;
        border-radius: 0 0 34px 34px;
      }
    }

    @media (max-width: 370px) {
      .risk-main {
        grid-template-columns: minmax(0, 1fr) 104px;
        padding-right: 15px;
        padding-left: 16px;
      }

      .mascot {
        width: 86px;
        height: 100px;
      }

      .eye-left { left: 24px; }
      .eye-right { right: 24px; }
      .antenna { left: 41px; }
      .risk-scale { margin-right: 16px; margin-left: 16px; }
      .metric-card { padding: 15px; }
      .last-disposal { gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body data-risk="caution">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="コバエみまもり">
        <div class="brand-mark" aria-hidden="true">K</div>
        <div>
          <p class="brand-name">コバエみまもり</p>
          <p class="brand-subtitle">M5Stack キッチンセンサー</p>
        </div>
      </div>
      <div class="connection" id="connection" aria-live="polite">
        <span class="connection-dot" aria-hidden="true"></span>
        <span id="connectionText">デモデータ</span>
      </div>
    </header>

    <main>
      <section class="risk-panel" aria-labelledby="riskHeading" aria-live="polite">
        <div class="risk-main">
          <div>
            <p class="eyebrow">現在の危険度</p>
            <div class="risk-value-row">
              <span class="risk-label" id="riskLabel">注意</span>
              <span class="risk-points"><strong id="riskPoints">4.5</strong> pt</span>
            </div>
            <h1 class="risk-heading" id="riskHeading">そろそろ気にしてみよう</h1>
            <p class="risk-message" id="riskMessage">気温と湿度が少し高めです。今日中に生ごみを捨てると安心です。</p>
          </div>

          <div class="mascot-stage" id="mascotStage">
            <span class="confetti confetti-one" aria-hidden="true"></span>
            <span class="confetti confetti-two" aria-hidden="true"></span>
            <span class="confetti confetti-three" aria-hidden="true"></span>
            <div class="mascot-shadow" aria-hidden="true"></div>
            <div class="mascot" id="mascot" data-expression="caution" role="img" aria-label="少し気にしているコバちゃん">
              <span class="antenna" aria-hidden="true"></span>
              <span class="eye eye-left" aria-hidden="true"></span>
              <span class="eye eye-right" aria-hidden="true"></span>
              <span class="cheek cheek-left" aria-hidden="true"></span>
              <span class="cheek cheek-right" aria-hidden="true"></span>
              <span class="mouth" aria-hidden="true"></span>
              <span class="sweat" aria-hidden="true"></span>
              <span class="foot foot-left" aria-hidden="true"></span>
              <span class="foot foot-right" aria-hidden="true"></span>
            </div>
            <span class="mascot-name">コバちゃん</span>
          </div>
        </div>

        <div class="risk-scale" aria-label="危険度の4段階">
          <span class="risk-step" data-level="safe">安全</span>
          <span class="risk-step is-current" data-level="caution" aria-current="true">注意</span>
          <span class="risk-step" data-level="warning">警戒</span>
          <span class="risk-step" data-level="danger">危険</span>
        </div>
      </section>

      <section class="metrics" aria-label="現在の温度と湿度">
        <article class="metric-card temperature">
          <div class="metric-head">
            <span class="metric-icon" aria-hidden="true">℃</span>
            <span>現在の温度</span>
          </div>
          <p class="metric-value"><span id="temperature">26.8</span><small>℃</small></p>
          <p class="metric-note" id="temperatureNote">やや暖かめ</p>
        </article>

        <article class="metric-card humidity">
          <div class="metric-head">
            <span class="metric-icon" aria-hidden="true">%</span>
            <span>現在の湿度</span>
          </div>
          <p class="metric-value"><span id="humidity">66</span><small>%</small></p>
          <p class="metric-note" id="humidityNote">少し高め</p>
        </article>
      </section>

      <section class="last-disposal" aria-labelledby="lastDisposalLabel">
        <div class="trash-icon" aria-hidden="true">♻</div>
        <div class="last-copy">
          <p class="last-label" id="lastDisposalLabel">最後に生ごみを捨てた時刻</p>
          <p class="last-time" id="lastDisposalTime">今日 16:00</p>
        </div>
        <span class="elapsed-badge" id="elapsedTime">3時間前</span>
      </section>
    </main>

    <div class="action-dock">
      <button class="dispose-button" id="disposeButton" type="button">
        <span class="button-icon" aria-hidden="true">✓</span>
        <span id="disposeButtonLabel">生ごみを捨てた</span>
      </button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">記録しました。きれいになったね！</div>
  <p class="screen-reader-only" id="screenReaderStatus" aria-live="assertive"></p>

  <script>
    (() => {
      "use strict";

      /*
        Firebase接続時は、このスクリプトより前に window.kobaeDataSource を用意します。

        window.kobaeDataSource = {
          mode: "firebase",
          subscribe(onData, onError) {
            // onData({ temperature, humidity, lastDisposedAt, updatedAt }) を呼ぶ
            // 監視を解除する関数を返す
          },
          async markDisposed() {
            // Firebaseへ現在時刻を書き込む
          }
        };
      */

      const STORAGE_KEY = "kobae-monitor-last-disposed-at";
      const LEVELS = [
        {
          key: "safe",
          label: "安全",
          heading: "今日もきれいでいい感じ",
          message: "今の環境なら落ち着いています。この調子で清潔を保ちましょう。",
          characterLabel: "にっこりしているコバちゃん"
        },
        {
          key: "caution",
          label: "注意",
          heading: "そろそろ気にしてみよう",
          message: "気温か湿度が少し高めです。今日中に生ごみを捨てると安心です。",
          characterLabel: "少し気にしているコバちゃん"
        },
        {
          key: "warning",
          label: "警戒",
          heading: "早めに捨てるのがおすすめ",
          message: "コバエが寄りやすい状態です。できるだけ早く片付けましょう。",
          characterLabel: "心配しているコバちゃん"
        },
        {
          key: "danger",
          label: "危険",
          heading: "今すぐ生ごみをチェック",
          message: "発生リスクが高まっています。生ごみを捨て、周りも軽く掃除しましょう。",
          characterLabel: "汗をかいて困っているコバちゃん"
        }
      ];

      const elements = {
        body: document.body,
        connection: document.getElementById("connection"),
        connectionText: document.getElementById("connectionText"),
        riskLabel: document.getElementById("riskLabel"),
        riskPoints: document.getElementById("riskPoints"),
        riskHeading: document.getElementById("riskHeading"),
        riskMessage: document.getElementById("riskMessage"),
        riskSteps: [...document.querySelectorAll(".risk-step")],
        temperature: document.getElementById("temperature"),
        temperatureNote: document.getElementById("temperatureNote"),
        humidity: document.getElementById("humidity"),
        humidityNote: document.getElementById("humidityNote"),
        lastDisposalTime: document.getElementById("lastDisposalTime"),
        elapsedTime: document.getElementById("elapsedTime"),
        mascot: document.getElementById("mascot"),
        mascotStage: document.getElementById("mascotStage"),
        disposeButton: document.getElementById("disposeButton"),
        disposeButtonLabel: document.getElementById("disposeButtonLabel"),
        toast: document.getElementById("toast"),
        screenReaderStatus: document.getElementById("screenReaderStatus")
      };

      let currentData = null;
      let toastTimer = null;
      let celebrationTimer = null;

      function readSavedDisposalTime() {
        try {
          const value = Number(localStorage.getItem(STORAGE_KEY));
          return Number.isFinite(value) && value > 0 ? value : null;
        } catch (error) {
          return null;
        }
      }

      function saveDisposalTime(timestamp) {
        try {
          localStorage.setItem(STORAGE_KEY, String(timestamp));
        } catch (error) {
          // ローカル保存が使えなくても、画面上のデモ操作は続ける。
        }
      }

      function createMockDataSource() {
        const listeners = new Set();
        const savedTime = readSavedDisposalTime();
        const state = {
          temperature: 26.8,
          humidity: 66,
          lastDisposedAt: savedTime || Date.now() - (3 * 60 * 60 * 1000),
          updatedAt: Date.now()
        };

        function snapshot() {
          return { ...state };
        }

        function notify() {
          const data = snapshot();
          listeners.forEach((listener) => listener(data));
        }

        const timer = window.setInterval(() => {
          const phase = Date.now() / 240000;
          state.temperature = Math.round((26.8 + Math.sin(phase) * 0.25) * 10) / 10;
          state.humidity = Math.round(66 + Math.cos(phase) * 1.2);
          state.updatedAt = Date.now();
          notify();
        }, 60000);

        return {
          mode: "mock",
          subscribe(onData) {
            listeners.add(onData);
            onData(snapshot());
            return () => {
              listeners.delete(onData);
              if (listeners.size === 0) window.clearInterval(timer);
            };
          },
          async markDisposed() {
            state.lastDisposedAt = Date.now();
            state.updatedAt = Date.now();
            saveDisposalTime(state.lastDisposedAt);
            notify();
            return snapshot();
          }
        };
      }

      function toTimestamp(value) {
        if (value && typeof value.toMillis === "function") return value.toMillis();
        if (value && typeof value.toDate === "function") return value.toDate().getTime();
        if (value instanceof Date) return value.getTime();
        const timestamp = typeof value === "string" ? Date.parse(value) : Number(value);
        return Number.isFinite(timestamp) ? timestamp : Date.now();
      }

      function normalizeData(rawData) {
        const temperature = Number(rawData?.temperature);
        const humidity = Number(rawData?.humidity);
        return {
          temperature: Number.isFinite(temperature) ? temperature : 0,
          humidity: Number.isFinite(humidity) ? humidity : 0,
          lastDisposedAt: toTimestamp(rawData?.lastDisposedAt),
          updatedAt: toTimestamp(rawData?.updatedAt)
        };
      }

      function calculateRisk(data) {
        const elapsedHours = Math.max(0, Date.now() - data.lastDisposedAt) / 3600000;
        let environmentMultiplier = 1;
        if (data.temperature >= 28 || data.humidity >= 80) {
          environmentMultiplier = 2;
        } else if (data.temperature >= 23 || data.humidity >= 65) {
          environmentMultiplier = 1.5;
        }

        const points = elapsedHours * environmentMultiplier;
        const levelIndex = points < 2 ? 0 : points < 6 ? 1 : points < 12 ? 2 : 3;
        return { points, level: LEVELS[levelIndex] };
      }

      function formatLastDisposed(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const startTarget = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
        const dayDifference = Math.round((startToday - startTarget) / 86400000);
        const time = new Intl.DateTimeFormat("ja-JP", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(date);

        if (dayDifference === 0) return `今日 ${time}`;
        if (dayDifference === 1) return `昨日 ${time}`;
        return new Intl.DateTimeFormat("ja-JP", {
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(date);
      }

      function formatElapsed(timestamp) {
        const elapsedMinutes = Math.max(0, Math.floor((Date.now() - timestamp) / 60000));
        if (elapsedMinutes < 1) return "たった今";
        if (elapsedMinutes < 60) return `${elapsedMinutes}分前`;
        const elapsedHours = Math.floor(elapsedMinutes / 60);
        if (elapsedHours < 24) return `${elapsedHours}時間前`;
        return `${Math.floor(elapsedHours / 24)}日前`;
      }

      function temperatureNote(value) {
        if (value >= 28) return "高め・要注意";
        if (value >= 23) return "やや暖かめ";
        return "落ち着いた温度";
      }

      function humidityNote(value) {
        if (value >= 80) return "かなり高め";
        if (value >= 65) return "少し高め";
        return "落ち着いた湿度";
      }

      function render(rawData) {
        currentData = normalizeData(rawData);
        const risk = calculateRisk(currentData);

        elements.body.dataset.risk = risk.level.key;
        elements.riskLabel.textContent = risk.level.label;
        elements.riskPoints.textContent = risk.points.toFixed(1);
        elements.riskHeading.textContent = risk.level.heading;
        elements.riskMessage.textContent = risk.level.message;

        elements.riskSteps.forEach((step) => {
          const isCurrent = step.dataset.level === risk.level.key;
          step.classList.toggle("is-current", isCurrent);
          if (isCurrent) step.setAttribute("aria-current", "true");
          else step.removeAttribute("aria-current");
        });

        elements.temperature.textContent = currentData.temperature.toFixed(1);
        elements.temperatureNote.textContent = temperatureNote(currentData.temperature);
        elements.humidity.textContent = Math.round(currentData.humidity);
        elements.humidityNote.textContent = humidityNote(currentData.humidity);
        elements.lastDisposalTime.textContent = formatLastDisposed(currentData.lastDisposedAt);
        elements.elapsedTime.textContent = formatElapsed(currentData.lastDisposedAt);
        elements.mascot.dataset.expression = risk.level.key;
        elements.mascot.setAttribute("aria-label", risk.level.characterLabel);
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        elements.toast.textContent = message;
        elements.toast.classList.add("is-visible");
        toastTimer = window.setTimeout(() => {
          elements.toast.classList.remove("is-visible");
        }, 2300);
      }

      function celebrate() {
        window.clearTimeout(celebrationTimer);
        elements.mascotStage.classList.add("is-celebrating");
        celebrationTimer = window.setTimeout(() => {
          elements.mascotStage.classList.remove("is-celebrating");
        }, 1300);
      }

      const dataSource = window.kobaeDataSource || createMockDataSource();
      const isFirebase = dataSource.mode === "firebase";
      elements.connection.classList.toggle("is-live", isFirebase);
      elements.connectionText.textContent = isFirebase ? "接続中" : "デモデータ";

      dataSource.subscribe(
        (data) => render(data),
        () => {
          elements.connection.classList.remove("is-live");
          elements.connectionText.textContent = "接続エラー";
          showToast("データを取得できませんでした");
        }
      );

      elements.disposeButton.addEventListener("click", async () => {
        elements.disposeButton.disabled = true;
        elements.disposeButtonLabel.textContent = "記録しています…";

        try {
          const updatedData = await dataSource.markDisposed();
          render(updatedData || {
            ...currentData,
            lastDisposedAt: Date.now(),
            updatedAt: Date.now()
          });
          celebrate();
          showToast("記録しました。きれいになったね！");
          elements.screenReaderStatus.textContent = "生ごみを捨てた時刻を、たった今に更新しました。";
          elements.disposeButtonLabel.textContent = "記録しました！";
          if (navigator.vibrate) navigator.vibrate(45);
        } catch (error) {
          showToast("記録できませんでした。もう一度お試しください");
          elements.screenReaderStatus.textContent = "生ごみを捨てた時刻を記録できませんでした。";
          elements.disposeButtonLabel.textContent = "もう一度試す";
        } finally {
          window.setTimeout(() => {
            elements.disposeButton.disabled = false;
            elements.disposeButtonLabel.textContent = "生ごみを捨てた";
          }, 1100);
        }
      });

      window.setInterval(() => {
        if (currentData) render(currentData);
      }, 60000);
    })();
  </script>
</body>
</html>
